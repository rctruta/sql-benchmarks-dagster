version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sql_bench_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d benchmark_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


