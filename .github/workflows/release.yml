name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers when you push a tag like v0.1.0

jobs:
  build-and-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest

    # CRITICAL: These permissions are required for Trusted Publishing (OIDC) to work!
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pyyaml any more: the publish contract is TOML and tomllib has been
      # in the standard library since 3.11. The 0.1.4 release failed twice on
      # a missing library in this job -- first pyyaml, then pytest -- because
      # it deliberately installs none of the project's dependencies. A gate
      # that runs here needs nothing beyond the standard library, and the
      # checks that do need something declare the stage they belong to.
      - name: Install build tools
        run: python -m pip install --upgrade pip build

      # Before building, not after: a release whose manifest names the
      # previous version, or whose README has lost the mcp-name token, is a
      # release the MCP registry will describe wrongly or refuse outright.
      # 0.1.3 shipped without that token because main never had it.
      - name: Refuse a release whose server.json or README disagrees
        run: python .gates/check_publish_contract.py --check --stage prepublish


      - name: Build a binary wheel and a source tarball
        run: python -m build

      # Between building and publishing, because 0.1.2 went to PyPI with 881
      # files that are not this package -- scratch/, venv/, build/ nested six
      # deep -- and `python -m build` exited 0 the whole time. The rule was
      # already written down; this is the rule as a step.
      - name: Refuse a wheel containing anything but the package
        run: python .gates/check_publish_contract.py --check --stage postbuild

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
