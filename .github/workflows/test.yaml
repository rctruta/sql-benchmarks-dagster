name: SQL Benchmarks CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies  
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Full Test Suite
      env:
        # This makes 'sql_benchmarks' importable without 'pip install -e .'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # The runner has Docker, so the Postgres/Quack tests run for real here —
        # CI runs the FULL suite for maximum coverage (402+ pass). Only Actian is
        # ignored (needs an SSH key). The `integration` marker exists for a fast
        # LOCAL loop (`pytest -m "not integration"`), NOT to thin out CI.
        pytest sql_benchmarks_tests/ --ignore=sql_benchmarks_tests/test_actian_integration.py -v
