name: SQL Benchmarks CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the project in editable mode with dev deps
        pip install -e ".[dev]"

    - name: Run Integrity & Schema Tests
      # This guarantees your YAMLs always match the V7 Schema
      run: |
        pytest sql_benchmarks_tests/test_config_integrity.py

    - name: Run Unit Tests
      # Checks the "Brain" (Math, Hashers, Utils)
      run: |
        pytest sql_benchmarks_tests/test_utils.py

    - name: Run Infrastructure Smoke Tests
      # Checks that Dagster can load your Partitions & Assets without crashing
      # This catches the "2 Dimensions" vs "3 Dimensions" bugs
      run: |
        pytest sql_benchmarks_tests/test_dagster_infra.py
        pytest sql_benchmarks_tests/test_assets.py