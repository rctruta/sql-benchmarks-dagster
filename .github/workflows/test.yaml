name: SQL Benchmarks CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies  
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        echo "=== DEBUG: INSTALLED PACKAGES ==="
        pip list
        echo "================================="

    - name: Run Integrity & Schema Tests
      run: |
        pytest sql_benchmarks_tests/test_config_integrity.py

    - name: Run Unit Tests
      run: |
        pytest sql_benchmarks_tests/test_utils.py

    - name: Run Infrastructure Smoke Tests
      run: |
        pytest sql_benchmarks_tests/test_dagster_infra.py
        pytest sql_benchmarks_tests/test_assets.py