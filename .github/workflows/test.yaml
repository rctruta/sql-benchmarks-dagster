name: SQL Benchmarks CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies  
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Full Test Suite
      env:
        # This makes 'sql_benchmarks' importable without 'pip install -e .'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # This tells pytest to ignore the Actian test file 
        # that requires the SSH key.
        pytest sql_benchmarks_tests/ --ignore=sql_benchmarks_tests/test_actian_integration.py -v
