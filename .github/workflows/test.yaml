name: SQL Benchmarks CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies  
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (unit + logic; infra tests are tiered out)
      env:
        # This makes 'sql_benchmarks' importable without 'pip install -e .'
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # `-m "not integration"` excludes tests needing external infra the runner
        # doesn't have (Docker Postgres, Quack server, remote Actian/TypeDB) —
        # auto-tagged in conftest.py. Run the full set locally with Docker up.
        pytest sql_benchmarks_tests/ -m "not integration" -v
