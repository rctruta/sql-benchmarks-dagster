[project]
name = "sql_benchmarks"
version = "0.1.0"
description = "SQL Benchmarks V7 Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-postgres",
    "dagster-duckdb",
    "docker",
    "pandas",
    "plotly",
    "polars",
    "pyarrow",
    "psycopg2-binary",
    "sqlalchemy",
    "psutil",
    "pyyaml",
    "numpy",
    "paramiko<4.0.0",
    "sshtunnel>=0.4.0",
    "scp>=0.14.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "typedb-driver",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver", 
    "pytest"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "sql_benchmarks.definitions"
code_location_name = "sql_benchmarks"

[tool.setuptools.packages.find]
exclude = ["sql_benchmarks_tests"]

[tool.pytest.ini_options]
# Migrated from pytest.ini. Filters target deprecation warnings raised by
# external dependencies (Dagster's Pydantic V1 usage; plotly's np.bool8).
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:pydantic",
    "ignore:`np.bool8` is a deprecated alias:DeprecationWarning:plotly",
]
