[project]
name = "sqlbenchdag"
version = "0.1.3"
description = "A reproducible, content-addressed SQL engine benchmarking laboratory."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ramona C. Truta" }]
keywords = [
    "benchmarking",
    "sql",
    "duckdb",
    "postgres",
    "dagster",
    "reproducibility",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-postgres",
    "dagster-duckdb",
    "docker",
    "pandas",
    "plotly",
    "polars",
    "pyarrow",
    # Imported directly by the package (were only present transitively via dagster).
    # litellm: imported by agent_specialist.py and scripts/autonomous_agent.py but
    # declared nowhere until 2026-07-28 — it survived only as an ad-hoc install, so
    # `uv sync` (which prunes to the lock) took the agent test suite red. An
    # undeclared runtime import is a latent break in any clean environment.
    "litellm",
    # PINNED 2026-07-27: DuckDB extensions are built per DuckDB version, and the
    # local quack extension exists only for 1.5.3. Unpinned, the lock froze
    # 1.5.1, which silently broke every quack lane with
    #   IOException: Extension ".../v1.5.1/osx_arm64/quack.duckdb_extension" not found
    # All 8 capsules that ever ran a quack lane recorded duckdb 1.5.3
    # (b8e2bfaf, 25b0e134, 902d1277, b198363e, 461beee8, 28f7aa1c, 07c16e50,
    # ac715d9d), so 1.5.3 is also the version the published quack results were
    # produced under. Pinning restores reproducibility rather than changing it.
    "duckdb==1.5.3",
    "jinja2",
    "pydantic",
    "psycopg2-binary",
    "sqlalchemy",
    "psutil",
    "pyyaml",
    "numpy",
    "paramiko<4.0.0",
    "sshtunnel>=0.4.0",
    "scp>=0.14.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "fastmcp>=0.1.0",
    # Provides the `fastmcp` import name since the 4.x split; see requirements.txt.
    "fastmcp-slim>=4.1.0",
    "httpx>=0.27.0",
    "typedb-driver",
    # Result-transport drivers — postgres_transport (psycopg/adbc/connectorx) and
    # quack_adbc engines. Pinned to the versions that produced the sealed
    # transport capsules (e.g. af6ba593) so the lane is reproducible by an outsider.
    "adbc-driver-manager==1.11.0",
    "adbc-driver-postgresql==1.11.0",
    "connectorx==0.4.5",
    "adbc-driver-quack==0.1.0a8",
    "modal>=1.5.3",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
    "matplotlib"
]

[project.urls]
Homepage = "https://github.com/rctruta/sql-benchmarks-dagster"
Repository = "https://github.com/rctruta/sql-benchmarks-dagster"

[project.scripts]
sqlbench = "sql_benchmarks.cli:main"
# Declared here since 0.1.3. It shipped in the 0.1.2 wheel -- published by hand
# from an uncommitted tree, with no v0.1.2 tag -- so the console script every
# installed MCP client invokes had no declaration in version control.
sqlbench-mcp = "sql_benchmarks.mcp.server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "sql_benchmarks.definitions"
code_location_name = "sql_benchmarks"

[tool.setuptools]
# include-package-data defaults to TRUE for a pyproject-only build, and with no
# MANIFEST.in to constrain it setuptools swept whatever happened to be sitting
# in the working directory when a release was cut. Version 0.1.2 therefore
# shipped to PyPI with scratch/ (12 files of local notes), venv/,
# infrastructure/, tests/, skills/ and a build/ tree nested six deep -- 853 of
# its 1089 files, 82% of the wheel, and /Users/ramona in 42 of them. One file
# was skipped by a third-party scanner for exceeding its file budget on those
# duplicates, so the bloat cost real inspection coverage too.
#
# False means package-data below is the ONLY data that ships. Adding a file to
# the distribution is now a deliberate line in this table.
include-package-data = false

[tool.setuptools.packages.find]
# Named explicitly. An unanchored find walks the project root, so anything that
# looks like a package in a stale build tree is a candidate.
include = ["sql_benchmarks*"]
exclude = ["sql_benchmarks_tests*"]

# Ship the SQL suites and the experiment template, but NOT local result
# capsules (experiments/results/**/*.yaml) — those are run output, not package data.
[tool.setuptools.package-data]
sql_benchmarks = [
    "scripts/sql/**/*.sql",
    "scripts/sql/**/*.sql.template",
    "experiments/templates/*.yaml",
    # The category taxonomy. Omitted from the manifest until 0.1.3, which made
    # list_categories and list_suites return empty arrays on every clean
    # install: the SQL shipped, but the file that indexes it did not, so an
    # installed MCP server could not tell an agent what suites exist.
    # Empty-but-successful is the worst failure shape -- it looks like "no
    # data" rather than "missing file".
    "experiments/taxonomy.yaml",
]

[tool.pytest.ini_options]
# Migrated from pytest.ini. Filters target deprecation warnings raised by
# external dependencies (Dagster's Pydantic V1 usage; plotly's np.bool8).
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:pydantic",
    "ignore:`np.bool8` is a deprecated alias:DeprecationWarning:plotly",
]
markers = [
    "integration: needs external infra (Docker Postgres, Quack server, remote Actian/TypeDB) — excluded from the default CI run",
    "e2e: a full experiment driven through the harness (slow)",
]
