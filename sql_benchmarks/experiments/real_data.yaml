meta:
  experiment_id: "real_data_v1"
  description: "Benchmarking against production CSV dump"

dataset:
  # SWITCH THE PLUGIN
  source: "sql_benchmarks.plugins.data_sources.local_file_loader"
  
  # DEFINE TABLES (Must match your SQL variables)
  tables:
    - customers
    - orders
  
  # DEFINE PATHS (Absolute paths are safest)
  paths:
    customers: "/Users/ramona/Downloads/production_customers.csv"
    orders: "/Users/ramona/Downloads/production_orders.csv"

# --- BOILERPLATE (Required for Partition Keys) ---
definitions:
  rows:
    prod: 0 # Placeholder (ignored by loader)
  constants:
    orders_per_customer: 1
  orphan_labels:
    0.00: "production"

dimensions:
  size: [prod]
  orphan_rate: [0.00]

engines:
  - duckdb
  # - postgres (Optional)