meta:
  experiment_id: "baseline_v1"
  description: "Standard benchmark: Orders & Customers with 10% skew"

# THE CONTRACT: Must match variables in your SQL files
dataset:
  source: "sql_benchmarks.plugins.data_sources.synthetic_generic"
  tables:
    customers:
      rows: "rows" # 100% of partition size
      columns:
        - name: customer_id
          provider: sequence
        - name: region
          provider: choice
          options: ["US", "EU", "APAC"]
    
    orders:
      rows: "rows" 
      columns:
        - name: order_id
          provider: sequence
        - name: amount
          provider: uniform
          min: 10
          max: 500
        - name: customer_id
          provider: foreign_key
          target_table: customers
          target_column: customer_id
          apply_orphan_rate: true # This enables the skew logic

definitions:
  rows:
    tiny: 1_000
    small: 100_000
    medium: 1_000_000
  orphan_rate_labels:
    0.00: "clean"
    0.10: "skew10"
  constants:
    ratio: 10

dimensions:
  size: [small]
  orphan_rate: [0.00, 0.10] # Test Clean vs Dirty

engines:
  - duckdb
  - postgres