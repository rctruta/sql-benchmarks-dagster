meta:
  description: "TPC-H Standard Benchmark (Scale Factor 0.1)"

dataset:
  # Point to your new plugin
  source: "sql_benchmarks.plugins.data_sources.tpc_h"
  
  # Standard TPC-H Schema
  tables:
    customer:
      columns:
        - name: c_custkey
          primary_key: true
        - name: c_mktsegment # Needed for Query 3
        
    orders:
      columns:
        - name: o_orderkey
          primary_key: true
        - name: o_custkey
          provider: foreign_key
          target_table: customer
          target_column: c_custkey
        - name: o_orderdate # Indexed for range queries
      indexes:
        - columns: ["o_orderdate"]
          name: "idx_orders_date"
        - columns: ["o_custkey"] # FK Index
          name: "idx_orders_cust"

    lineitem:
      columns:
        - name: l_orderkey
          provider: foreign_key
          target_table: orders
          target_column: o_orderkey
        - name: l_shipdate
      indexes:
        - columns: ["l_orderkey"]
          name: "idx_lineitem_order"
        - columns: ["l_shipdate"]
          name: "idx_lineitem_shipdate"

definitions:
  # Scale Factor 0.1 = ~600k lineitems (Fast Test)
  # Scale Factor 1.0 = ~6M lineitems (Stress Test)
  scale_factor:
    small: 0.1
    medium: 1.0 

dimensions:
  scale_factor: [small]
  # Dummy dimension to keep partition logic happy
  mode: ["standard"]

engines:
  - duckdb
  - postgres

execution:
  test_suite: "tpch" 
  replication: 3