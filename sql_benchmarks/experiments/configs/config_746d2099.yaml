meta:
  experiment_id: 746d2099
  description: Benchmarking 3-Valued Logic (Native) vs 2-Valued Logic (Zombie) for
    joins with NULLs.
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    r:
      rows: rows
      columns:
      - name: join_key_a
        provider: choice
        options:
        - A
        - B
        - C
        - D
        - E
        null_probability: 0.5
      - name: join_key_b
        provider: choice
        options:
        - 1
        - 2
        - 3
        - 4
        - 5
        null_probability: 0.5
      - name: payload
        provider: choice
        options:
        - payload_1
        - payload_2
        - zombie_candidate
definitions:
  rows:
    tiny: 1000
    small: 100000
    medium: 1000000
    large: 10000000
    mlarge: 50000000
    xlarge: 100000000
dimensions:
  size:
  - tiny
  - medium
  - large
  - xlarge
execution:
  test_suite: null_logic
  engines:
  - postgres
  - duckdb
  replication: 1
  matrix:
    rows:
    - tiny
    - medium
