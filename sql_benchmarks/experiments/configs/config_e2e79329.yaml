meta:
  experiment_id: e2e79329
  description: Testing scheduler limits with 50x replication
dataset:
  source: sql_benchmarks.plugins.data_sources.synthetic_generic
  tables:
    customers:
      rows: rows
      columns:
      - name: customer_id
        provider: sequence
      - name: region
        provider: choice
        options:
        - US
        - EU
        - APAC
    orders:
      rows: rows
      columns:
      - name: order_id
        provider: sequence
      - name: amount
        provider: uniform
        min: 10
        max: 500
      - name: customer_id
        provider: foreign_key
        target_table: customers
        target_column: customer_id
        apply_orphan_rate: true
execution:
  test_suite: joins
  replication: 50
definitions:
  rows:
    tiny: 1000
    small: 100000
    medium: 1000000
  orphan_rate_labels:
    0.0: clean
    0.1: skew10
  constants:
    ratio: 10
dimensions:
  size:
  - tiny
  orphan_rate:
  - 0.0
engines:
- duckdb
- postgres
