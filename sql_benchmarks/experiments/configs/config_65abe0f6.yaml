meta:
  description: 'Robustness Test: Cyclic Dependencies (Chicken -> Egg -> Chicken)'
  experiment_id: 65abe0f6
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    chicken:
      rows: 10
      columns:
      - name: id
        provider: sequence
      - name: origin_egg_id
        provider: foreign_key
        target_table: egg
        target_column: id
    egg:
      rows: 10
      columns:
      - name: id
        provider: sequence
      - name: layer_chicken_id
        provider: foreign_key
        target_table: chicken
        target_column: id
definitions:
  rows:
    default: 1
execution:
  engines:
  - duckdb
  matrix:
    size:
    - default
