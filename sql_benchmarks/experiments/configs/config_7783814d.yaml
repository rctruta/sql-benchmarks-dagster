  description: Benchmarking 3-Valued Logic (Native) vs 2-Valued Logic (Zombie) for
    joins with NULLs.
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    r:
      rows: rows
      columns:
      - name: join_key_a
        provider: sequence
        null_probability: 0.5
definitions:
