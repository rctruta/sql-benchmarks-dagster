meta:
  description: 'Group By: Optimization Impact of Constraints & Column Pruning'
  experiment_id: a16a2a05
dataset:
  source: sql_benchmarks.plugins.data_sources.synthetic_generic
  tables:
    customers:
      rows: rows
      columns:
      - name: customer_id
        provider: sequence
        primary_key: true
      - name: customer_name
        provider: text_concat
        prefix: 'Customer '
        source: customer_id
      - name: region
        provider: choice
        options:
        - US
        - EU
        - APAC
      indexes:
      - columns:
        - region
        name: idx_customers_region
    orders:
      rows: rows
      columns:
      - name: order_id
        provider: sequence
        primary_key: true
      - name: order_desc
        provider: text_concat
        prefix: 'Order Description '
        source: order_id
      - name: amount
        provider: uniform
        min: 10
        max: 500
      - name: customer_id
        provider: foreign_key
        target_table: customers
        target_column: customer_id
        apply_orphan_rate: true
      indexes:
      - columns:
        - customer_id
        name: idx_orders_customer
definitions:
  rows:
    medium: 1000000
    large: 10000000
    xlarge: 50000000
  orphan_rate_labels:
    0.0: clean
dimensions:
  size:
  - medium
  - large
  - xlarge
  orphan_rate:
  - 0.0
engines:
- duckdb
- postgres
execution:
  test_suite: group_by
  replication: 3
