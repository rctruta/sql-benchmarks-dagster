meta:
  name: 'Quack Pushdown Residual: Thread-Scaling Probe'
  description: "The execution-modes experiment (published capsule 3e2fe152) left an\
    \ open question: pushdown-mode Quack runs the identical query on the identical\
    \ file ~1.9x slower than in-process DuckDB, and the residual scales with execution\
    \ work \u2014 so it is neither round-trip cost nor result serialization (12-row\
    \ result set). Hypothesis: the Quack server executes queries with fewer effective\
    \ threads than an in-process connection (HTTP handler execution context). Probe:\
    \ sweep duckdb.threads in-process on the same partitions where quack_pushdown\
    \ runs with server defaults. If pushdown timings match in-process at a reduced\
    \ thread count (machine: 8 logical / 4 performance cores), the residual is explained\
    \ by parallelism, not protocol.\n"
  experiment_id: 2d0105fe
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    analytical_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: region
        provider: choice
        options:
        - North
        - South
        - East
        - West
      - name: category
        provider: choice
        options:
        - A
        - B
        - C
      - name: price
        provider: random_float
        min_value: 10.0
        max_value: 500.0
      - name: quantity
        provider: random_int
        min_value: 1
        max_value: 100
      - name: discount
        provider: random_float
        min_value: 0.0
        max_value: 0.3
definitions:
  rows:
    medium: 1000000
    large: 10000000
execution:
  test_suite: analytical_wall
  engines:
  - duckdb
  - quack_pushdown
  replication: 5
  matrix:
    rows:
    - medium
    - large
    duckdb.threads:
    - 1
    - 2
    - 4
    - 8
