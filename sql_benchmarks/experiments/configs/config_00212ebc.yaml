meta:
  description: 'Recursivity Depth Test: Wide (Zipf) vs Deep (Chain) vs Random (Uniform)'
  experiment_id: 00212ebc
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    hierarchy_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: parent_id
        provider: foreign_key
        target_table: hierarchy_data
        target_column: id
        distribution: topology
        zipf_a: 2.0
      - name: name
        provider: text_concat
        source: id
        prefix: node_
definitions:
  rows:
    small: 10000
    medium: 100000
  pg_settings:
    ssd:
      random_page_cost: 1.1
      work_mem: 256MB
execution:
  engines:
  - postgres
  - duckdb
  matrix:
    size:
    - medium
    topology:
    - uniform
    - chain
    - zipf
