meta:
  description: 'Optimizer Tipping Point: HDD (Seq Scan) vs SSD (Index Scan)'
  experiment_id: b332f4ca
dataset:
  source: sql_benchmarks.plugins.data_sources.synthetic_generic
  tables:
    skewed_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: selectivity_code
        provider: choice
        options:
        - sel_0_1
        - sel_1
        - sel_5
        - sel_10
        - sel_20
        - filler
        weights:
        - 0.001
        - 0.01
        - 0.05
        - 0.1
        - 0.2
        - 0.639
      - name: payload
        provider: text_concat
        prefix: PADDING_DATA_TO_FORCE_DISK_READS_AAAAAAAAAAAAAAAAAAAA_
        source: id
      indexes:
      - columns:
        - selectivity_code
        name: idx_selectivity
definitions:
  rows:
    small: 100000
    medium: 1000000
    large: 10000000
    xlarge: 100000000
  pg_settings:
    hdd:
      random_page_cost: 4.0
      work_mem: 64MB
    ssd:
      random_page_cost: 1.1
      work_mem: 256MB
dimensions:
  size:
  - small
  - medium
  - large
  - xlarge
  disk_type:
  - hdd
  - ssd
engines:
- postgres
- duckdb
execution:
  test_suite: selectivity
  replication: 3
