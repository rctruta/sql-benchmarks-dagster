meta:
  description: TPC-H Standard Benchmark (Scale Factor 0.1)
  experiment_id: d0eed758
dataset:
  source: sql_benchmarks.plugins.data_sources.tpc_h
  tables:
    customer:
      columns:
      - name: c_custkey
        primary_key: true
      - name: c_mktsegment
    orders:
      columns:
      - name: o_orderkey
        primary_key: true
      - name: o_custkey
        provider: foreign_key
        target_table: customer
        target_column: c_custkey
      - name: o_orderdate
      indexes:
      - columns:
        - o_orderdate
        name: idx_orders_date
      - columns:
        - o_custkey
        name: idx_orders_cust
    lineitem:
      columns:
      - name: l_orderkey
        provider: foreign_key
        target_table: orders
        target_column: o_orderkey
      - name: l_shipdate
      indexes:
      - columns:
        - l_orderkey
        name: idx_lineitem_order
      - columns:
        - l_shipdate
        name: idx_lineitem_shipdate
definitions:
  scale_factor:
    small: 0.1
    medium: 1.0
dimensions:
  scale_factor:
  - small
  mode:
  - standard
engines:
- duckdb
- postgres
execution:
  test_suite: tpch
  replication: 3
