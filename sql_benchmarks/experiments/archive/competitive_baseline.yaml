meta:
  experiment_id: b935aa3f
  description: 'Actian X100 vs. Postgres vs. DuckDB: Analytical Wall (10M Rows)'
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    analytical_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: region
        provider: choice
        options:
        - North
        - South
        - East
        - West
        - Central
        - EMEA
        - APAC
        - LATAM
      - name: category
        provider: choice
        options:
        - Hardware
        - Software
        - Cloud
        - Consulting
        - Support
        - Training
      - name: price
        provider: random_float
        min: 10.0
        max: 5000.0
      - name: quantity
        provider: random_int
        min: 1
        max: 100
      - name: discount
        provider: random_float
        min: 0.0
        max: 0.3
definitions:
  rows:
    small: 100000
    medium: 1000000
    large: 10000000
    xlarge: 50000000
execution:
  test_suite: analytical_wall
  replication: 3
  engines:
  - postgres
  - duckdb
  matrix:
    rows:
    - medium
    - large
    disk_type:
    - ssd
