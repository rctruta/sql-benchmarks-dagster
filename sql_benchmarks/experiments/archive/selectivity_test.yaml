meta:
  description: "Optimizer Tipping Point: HDD (Seq Scan) vs SSD (Index Scan)"

dataset:
  source: "sql_benchmarks.plugins.data_sources.declarative_gen"
  tables:
    skewed_data:
      rows: "rows"
      columns:
        - name: id
          provider: sequence
          primary_key: true
        - name: selectivity_code
          provider: choice
          options: ["sel_0_1", "sel_1", "sel_5", "sel_10", "sel_20", "filler"]
          weights: [0.001, 0.01, 0.05, 0.10, 0.20, 0.639]
        - name: payload
          provider: text_concat
          prefix: "PADDING_DATA_TO_FORCE_DISK_READS_AAAAAAAAAAAAAAAAAAAA_"
          source: id
      indexes:
        - columns: ["selectivity_code"]
          name: "idx_selectivity"

definitions:
  rows:
    small: 100_000
    medium: 1_000_000
    large: 10_000_000
    xlarge: 100_000_000
  
  # DEFINING THE HARDWARE SIMULATION
  pg_settings:
    hdd:
      random_page_cost: 4.0  # Default: Expensive Seeking (Prefers Seq Scan)
      work_mem: "64MB"
    ssd:
      random_page_cost: 1.1  # Tuning: Cheap Seeking (Prefers Index Scan)
      work_mem: "256MB"      # Let's give SSD mode more RAM too

dimensions:
  size: [small, medium]
#  size: [small, medium, large, xlarge]

execution:
  test_suite: "selectivity"
  replication: 3
  engines: ["postgres", "duckdb"]
  matrix:
    rows: [10_000, 100_000]
    disk_type: ["ssd"]  