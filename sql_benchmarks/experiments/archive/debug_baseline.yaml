meta:
  description: "Debug Version of Competitive Baseline (Small Data)"

dataset:
  source: "sql_benchmarks.plugins.data_sources.declarative_gen"
  tables:
    analytical_data:
      rows: "rows"
      columns:
        - name: id
          provider: sequence
          primary_key: true
        - name: region
          provider: choice
          options: ["North", "South", "East", "West"]
        - name: category
          provider: choice
          options: ["A", "B", "C"]
        - name: price
          provider: random_float
          min: 10.0
          max: 50.0
        - name: quantity
          provider: random_int
          min: 1
          max: 100
        - name: discount
          provider: random_float
          min: 0.0
          max: 0.30

definitions:
  rows:
    tiny: 100

execution:
  test_suite: "analytical_wall"
  replication: 1
  engines: ["postgres", "duckdb", "actian"]
  matrix:
    rows: [tiny]
    disk_type: ["ssd"]
