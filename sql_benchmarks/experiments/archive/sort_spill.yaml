meta:
  name: Sort Spill Cliff
  description: "Measures the performance cliff that occurs when Postgres's sort operation\
    \ exceeds work_mem and spills to disk. work_mem is set to 4MB (tight) to expose\
    \ the cliff at a measurable row count. DuckDB runs the same query as a control\
    \ \u2014 no equivalent spill constraint, showing the cost of the Postgres architectural\
    \ constraint.\n"
  experiment_id: f7f64995
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    sort_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: region
        provider: choice
        options:
        - North
        - South
        - East
        - West
        - Central
        - EMEA
        - APAC
        - LATAM
      - name: category
        provider: choice
        options:
        - Hardware
        - Software
        - Cloud
        - Consulting
        - Support
        - Training
      - name: department
        provider: choice
        options:
        - Sales
        - Finance
        - Ops
        - Engineering
        - Marketing
        - Legal
      - name: sub_category
        provider: choice
        options:
        - Tier1
        - Tier2
        - Tier3
        - Tier4
        - Tier5
      - name: price
        provider: random_float
        min_value: 10.0
        max_value: 5000.0
      - name: cost
        provider: random_float
        min_value: 5.0
        max_value: 4000.0
      - name: margin
        provider: random_float
        min_value: 0.0
        max_value: 1.0
      - name: quantity
        provider: random_int
        min_value: 1
        max_value: 500
      - name: discount
        provider: random_float
        min_value: 0.0
        max_value: 0.4
definitions:
  rows:
    tiny: 1000
    small: 100000
    medium: 1000000
    large: 10000000
    xlarge: 50000000
execution:
  test_suite: sort_spill
  engines:
  - postgres
  - duckdb
  replication: 3
  matrix:
    rows:
    - tiny
    - small
    - medium
    - large
    work_mem:
    - 4MB
    - 64MB
    - 256MB
    - 1GB
