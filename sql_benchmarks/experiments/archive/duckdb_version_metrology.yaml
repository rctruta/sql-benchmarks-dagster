meta:
  description: 'Cross-release metrology: DuckDB 1.5.3 vs 2.0.0 single-sweep performance
    comparison'
  experiment_id: 09ac7180
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    analytical_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: region
        provider: choice
        options:
        - North
        - South
        - East
        - West
      - name: category
        provider: choice
        options:
        - A
        - B
        - C
        - D
      - name: price
        provider: random_float
        min: 10.0
        max: 500.0
      - name: quantity
        provider: random_int
        min: 1
        max: 100
      - name: discount
        provider: random_float
        min: 0.0
        max: 0.3
definitions:
  rows:
    tiny: 1000
    small: 25000
execution:
  test_suite: analytical_wall
  engines:
  - duckdb_1_5
  - duckdb_2_0
  replication: 3
  matrix:
    rows:
    - small
    - tiny
