meta:
  name: 'DuckDB analytical aggregation scaling: small -> medium -> large -> xlarge'
  description: 'Investigates how DuckDB''s analytical_wall (12-group aggregation)
    scales as row count grows across four decades: 10K, 100K, 1M, 10M. DuckDB only,
    no Docker. Used to check whether duration grows roughly linearly with row count
    or shows super-linear acceleration (e.g. cache-hierarchy kink around 1M->10M reported
    in prior scaling_depth runs).

    '
  experiment_id: b8fa6226
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    analytical_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: region
        provider: choice
        options:
        - North
        - South
        - East
        - West
      - name: category
        provider: choice
        options:
        - A
        - B
        - C
      - name: price
        provider: random_float
        min_value: 10.0
        max_value: 500.0
      - name: quantity
        provider: random_int
        min_value: 1
        max_value: 100
      - name: discount
        provider: random_float
        min_value: 0.0
        max_value: 0.3
definitions:
  rows:
    small: 10000
    medium: 100000
    large: 1000000
    xlarge: 10000000
execution:
  test_suite: analytical_wall
  engines:
  - duckdb
  replication: 3
  matrix:
    rows:
    - large
    - medium
    - small
    - xlarge
