meta:
  description: "Quickstart \u2014 DuckDB only, no Docker required. Runs in seconds."
  experiment_id: b4c94d98
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    analytical_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: region
        provider: choice
        options:
        - North
        - South
        - East
        - West
      - name: category
        provider: choice
        options:
        - A
        - B
        - C
      - name: price
        provider: random_float
        min: 10.0
        max: 500.0
      - name: quantity
        provider: random_int
        min: 1
        max: 100
      - name: discount
        provider: random_float
        min: 0.0
        max: 0.3
definitions:
  rows:
    tiny: 100
    small: 10000
execution:
  test_suite: analytical_wall
  engines:
  - duckdb
  replication: 1
  matrix:
    rows:
    - tiny
