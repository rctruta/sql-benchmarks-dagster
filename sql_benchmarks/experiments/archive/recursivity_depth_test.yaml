
meta:
  description: "Recursivity Depth Test: Wide (Zipf) vs Deep (Chain) vs Random (Uniform) [Correct Architecture]"

dataset:
  source: "sql_benchmarks.plugins.data_sources.declarative_gen"
  tables:
    hierarchy_data:
      rows: "{size}"  # Dynamic from matrix
      columns:
        - name: id
          provider: sequence
        - name: parent_id
          provider: foreign_key
          target_table: hierarchy_data
          distribution: chain  # Ideally this should be {topology} but declarative_gen logic for this needs verifying
          # If we want dynamic topology, we need to pass it here.
          # The current provider "foreign_key" accepts "distribution".
          # We can map {topology} to distribution if we align the names.
          distribution: "{topology}" 
        - name: name
          provider: text_concat
          source: id
          prefix: "node_{topology}_"

definitions:
  rows:
    demo: 10
    small: 1000

  pg_settings:
    ssd:
      work_mem: "256MB"

execution:
  test_suite: "recursion"
  engines: [postgres, duckdb]
  matrix:
    size: [demo]
    pg_settings: [ssd]
    topology: [uniform, chain, zipf]
