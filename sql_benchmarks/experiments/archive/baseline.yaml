meta:
  experiment_id: "v7_refactor"
  description: "Clean architecture test"

dataset:
  source: "sql_benchmarks.plugins.data_sources.declarative_gen"
  tables:
    skewed_data:
      rows: "rows"
      columns:
        - name: id
          provider: sequence
          primary_key: true
        - name: selectivity_code
          provider: choice
          options: ["sel_0_1", "sel_1", "sel_5", "sel_10", "sel_20", "filler"]
          weights: [0.001, 0.01, 0.05, 0.10, 0.20, 0.639]
definitions:
  rows:
    tiny: 1000
    small: 100_000
    medium: 1_000_000
    large: 10_000_000
    mlarge: 50_000_000
    xlarge: 100_000_000

dimensions:
  size: [tiny, medium, large, xlarge]

execution:
  test_suite: "selectivity"
  replication: 3
  engines: ["postgres", "duckdb"]
  matrix:
    rows: [tiny, small, medium, large, xlarge]
    disk_type: ["ssd", "hdd"]