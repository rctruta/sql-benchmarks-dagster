meta:
  name: DuckDB analytical scaling
  description: Investigate how DuckDB performance scales on analytical aggregation
    queries with 2x scale increments.
dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    analytical_data:
      rows: rows
      columns:
      - name: id
        provider: sequence
        primary_key: true
      - name: region
        provider: choice
        options:
        - North
        - South
        - East
        - West
      - name: category
        provider: choice
        options:
        - A
        - B
        - C
      - name: price
        provider: random_float
        min: 10.0
        max: 500.0
      - name: quantity
        provider: random_int
        min: 1
        max: 100
      - name: discount
        provider: random_float
        min: 0.0
        max: 0.3
definitions:
  rows:
    small: 1000000
    medium: 2000000
    large: 4000000
execution:
  test_suite: analytical_wall
  engines:
  - duckdb
  replication: 3
  matrix:
    rows:
    - small
    - medium
    - large
