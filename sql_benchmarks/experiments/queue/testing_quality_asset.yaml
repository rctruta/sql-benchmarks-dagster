meta:
  experiment_id: "null_logic_test"
  description: "Benchmarking 3-Valued Logic (Native) vs 2-Valued Logic (Zombie) for joins with NULLs."

dataset:
  source: "sql_benchmarks.plugins.data_sources.declarative_gen"
  
  tables:
    r:
      rows: "rows" # Matrix param
      columns:
        - name: "join_key_a"
          provider: "sequence"
          null_probability: "null_probability"

definitions:
  rows:
    tiny: 1000
    small: 100_000
    medium: 1_000_000
    large: 10_000_000
    mlarge: 50_000_000
    xlarge: 100_000_000

  null_probability: 
    p_0_1: 0.01
    p_1: 0.1 
    p_25: 0.25
    p_50: 0.5

execution:
  test_suite: "null_logic"
  engines: ["postgres", "duckdb"]
  replication: 1 
  matrix:
    rows: [tiny] # 100k, 1M
    null_probability: [p_0_1, p_1, p_25, p_50]
