meta:
  name: "Sort Parallelism × Memory"
  description: >
    Investigates how Postgres's parallel sort interacts with work_mem.
    The prior sort_spill experiment revealed an unexpected inversion at 1M rows:
    4MB and 64MB work_mem ran ~2x faster than 256MB and 1GB. EXPLAIN ANALYZE
    confirmed the cause — Postgres silently disables parallel workers when
    work_mem is large enough that total memory (workers × work_mem) would be
    excessive. This experiment makes parallelism an explicit matrix dimension
    alongside work_mem to find the exact crossover points.

    Hypothesis: there is a (work_mem, workers) frontier where performance peaks.
    Below it, spill dominates. Above it, serial execution dominates.
    The sweet spot (found at 64MB / 3 workers) should shift with row scale.

    DuckDB is excluded — it ignores both settings and would add noise without signal.

dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    sort_data:
      rows: rows
      columns:
        - name: id
          provider: sequence
          primary_key: true
        - name: region
          provider: choice
          options: ["North", "South", "East", "West", "Central", "EMEA", "APAC", "LATAM"]
        - name: category
          provider: choice
          options: ["Hardware", "Software", "Cloud", "Consulting", "Support", "Training"]
        - name: department
          provider: choice
          options: ["Sales", "Finance", "Ops", "Engineering", "Marketing", "Legal"]
        - name: sub_category
          provider: choice
          options: ["Tier1", "Tier2", "Tier3", "Tier4", "Tier5"]
        - name: price
          provider: random_float
          min_value: 10.0
          max_value: 5000.0
        - name: cost
          provider: random_float
          min_value: 5.0
          max_value: 4000.0
        - name: margin
          provider: random_float
          min_value: 0.0
          max_value: 1.0
        - name: quantity
          provider: random_int
          min_value: 1
          max_value: 500
        - name: discount
          provider: random_float
          min_value: 0.0
          max_value: 0.40

definitions:
  rows:
    # tiny/small excluded — parallelism has no effect below ~100K rows
    # large excluded — 10M rows × 4 workers × sort_full × 3 replications = multi-hour run;
    #   run sort_parallel_large.yaml separately once medium results confirm the hypothesis
    medium: 1_000_000

execution:
  test_suite: sort_spill
  engines:
    - postgres           # DuckDB excluded — max_parallel_workers_per_gather is a PG-only setting
  replication: 3
  matrix:
    rows:
      - medium
    postgres.work_mem:
      - 4MB
      - 64MB
      - 256MB
      - 1GB
    postgres.max_parallel_workers_per_gather:
      - 0                # forced serial (baseline)
      - 1
      - 2
      - 4
