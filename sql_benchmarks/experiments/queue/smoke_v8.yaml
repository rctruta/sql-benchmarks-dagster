meta:
  experiment_id: smoke_v8
  description: Smoke test using original naming and semantic labels

dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    skewed_data:
      columns:
      - name: id
        provider: sequence
      - name: selectivity_code
        provider: choice
        options: ["sel_0_1", "sel_1", "sel_5", "sel_10", "sel_20", "filler"]
        weights: [0.01, 0.09, 4, 5, 10, 80]
      rows: "rows"

definitions:
  rows:
    tiny: 100

execution:
  engines: [duckdb]
  matrix:
    rows: [tiny]
  replication: 3
  test_suite: selectivity
