meta:
  name: "TPC-H Q3 Quack Validation"
  description: >
    Validates the Quack execution-mode findings (a3fe0c5f: attach-mode
    overhead grows with scan size, pushdown stays flat; 0fc417f9: pushdown
    residual consistent with ~2-3 effective server threads) on a join-heavy
    query shape and canonical data. TPC-H Q3 (shipping priority) joins
    customer x orders x lineitem with aggregation, generated by DuckDB's
    official tpch extension (dbgen) — not synthetic data. If the
    attach-grows / pushdown-flat pattern holds here, the finding generalizes
    beyond single-table aggregation.

dataset:
  # Resurrected from experiments/deprecated/bench_tpch_standard.yaml —
  # canonical TPC-H data via the official dbgen (tpch extension).
  source: "sql_benchmarks.plugins.data_sources.tpc_h"
  tables:
    customer:
      columns:
        - name: c_custkey
          primary_key: true
        - name: c_mktsegment   # needed for Query 3
    orders:
      columns:
        - name: o_orderkey
          primary_key: true
        - name: o_custkey
          provider: foreign_key
          target_table: customer
          target_column: c_custkey
        - name: o_orderdate
      indexes:
        - columns: ["o_orderdate"]
          name: "idx_orders_date"
        - columns: ["o_custkey"]
          name: "idx_orders_cust"
    lineitem:
      columns:
        - name: l_orderkey
          provider: foreign_key
          target_table: orders
          target_column: o_orderkey
        - name: l_shipdate
      indexes:
        - columns: ["l_orderkey"]
          name: "idx_lineitem_order"
        - columns: ["l_shipdate"]
          name: "idx_lineitem_shipdate"

definitions:
  # SF 0.1 = ~600K lineitem rows; SF 1.0 = ~6M lineitem rows
  scale_factor:
    small: 0.1
    medium: 1.0

execution:
  test_suite: tpch
  engines:
    - duckdb
    - quack
    - quack_pushdown
  replication: 3
  matrix:
    scale_factor:
      - small
      - medium
