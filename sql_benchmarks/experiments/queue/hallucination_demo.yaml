meta:
  name: hallucination_demo
  description: Demonstration of Semantic Firewall detecting hallucinations
  scenario_path: selectivity/duckdb

dataset:
  source: sql_benchmarks.plugins.data_sources.declarative_gen
  tables:
    hallucination_data:
      rows: rows          # alias into definitions.rows; literal ints are rejected
      columns:
        - name: id
          provider: sequence

definitions:
  rows:
    demo_scale: 10

execution:
  test_suite: selectivity
  engines:
    - duckdb
  replication: 1
  matrix:
    total_count:
      - -500              # this negative value trips the Semantic Firewall — the point of the demo
    rows:
      - demo_scale
