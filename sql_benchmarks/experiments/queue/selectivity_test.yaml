meta:
  description: "Optimizer Tipping Point: Index vs Seq Scan (0.1% to 64% Selectivity)"

dataset:
  source: "sql_benchmarks.plugins.data_sources.synthetic_generic"
  tables:
    skewed_data:
      rows: "rows"
      columns:
        - name: id
          provider: sequence
          primary_key: true
        
        # The Selectivity Column (Weighted Buckets)
        - name: selectivity_code
          provider: choice
          options: 
            - "sel_0_1"  # 0.1%
            - "sel_1"    # 1%
            - "sel_5"    # 5%
            - "sel_10"   # 10%
            - "sel_20"   # 20%
            - "filler"   # 63.9% (The Rest)
          weights: [0.001, 0.01, 0.05, 0.10, 0.20, 0.639]
          
        # Payload: 100 chars of padding to punish Disk I/O during Scans
        - name: payload
          provider: text_concat
          prefix: "PADDING_DATA_TO_FORCE_DISK_READS_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA__"
          source: id
      
      indexes:
        # The Index we want Postgres to choose (or ignore)
        - columns: ["selectivity_code"]
          name: "idx_selectivity"

definitions:
  rows:
    small: 100_000       # Does Index hurt here?
    medium: 1_000_000    # The transition zone?
    large: 10_000_000    # The Index should win here on low %

dimensions:
  size: [small, medium, large]
  orphan_rate: [0.00] 

engines:
  - postgres
  - duckdb

execution:
  test_suite: "selectivity"
  replication: 3