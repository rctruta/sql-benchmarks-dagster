why = "npm package distribution"

[[surfaces]]
id = "docker"
status = "planned"
trigger = "Dockerfile"
why = "Docker image container distribution"

[[surfaces]]
id = "github-action"
status = "planned"
trigger = "action.yml"
why = "GitHub Action marketplace distribution"
