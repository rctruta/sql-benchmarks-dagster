# Publishing surface requirements for sqlbenchdag.
# Read by .gates/check_publish_contract.py in pre-commit and release workflows.

[version_source]
path = "pyproject.toml"
kind = "toml_project_version"


[[surfaces]]
id = "pypi"
status = "live"
trigger = "pyproject.toml"
why = "sqlbenchdag distribution package on PyPI."

[[surfaces.requires]]
kind = "file_exists"
path = "README.md"
because = "PyPI renders README.md as the package long description"

[[surfaces.checks]]
path = "scripts/dev/check_wheel.py"
stages = ["postbuild"]


[[surfaces]]
id = "mcp-registry"
status = "live"
trigger = "server.json"
why = "io.github.rctruta/sqlbenchdag entry in the MCP registry."

[[surfaces.requires]]
kind = "json_version_matches_source"
path = "server.json"
field = "version"
because = "Ensures server.json version aligns with pyproject.toml"

[[surfaces.requires]]
kind = "json_version_matches_source"
path = "server.json"
field = "packages[].version"
because = "Ensures client install target package version aligns with pyproject.toml"

[[surfaces.requires]]
kind = "file_contains_json_field"
path = "README.md"
from = "server.json"
field = "name"
template = "mcp-name: {}"
because = "The MCP registry validates this token in README.md against the server name"

[[surfaces.checks]]
path = "sql_benchmarks_tests/test_mcp_registry_manifest.py"
stages = ["commit"]

[[surfaces.checks]]
path = "scripts/dev/check_server_manifest.py"
stages = ["commit", "prepublish"]


[[surfaces]]
id = "citation"
status = "live"
trigger = "CITATION.cff"
why = "Software citation metadata in CITATION.cff format."

[[surfaces.requires]]
kind = "yaml_version_matches_source"
path = "CITATION.cff"
field = "version"
because = "Citation version must match current release version"


