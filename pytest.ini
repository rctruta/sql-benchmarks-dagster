[pytest]
# This filter targets the specific Pydantic V2 deprecation warning that is 
# caused by the external Dagster dependency requiring deprecated V1 syntax.
# The filter is applied early by pytest, guaranteeing suppression.
filterwarnings =
    ignore:Support for class-based `config` is deprecated:DeprecationWarning:pydantic
    ignore:`np.bool8` is a deprecated alias:DeprecationWarning:plotly